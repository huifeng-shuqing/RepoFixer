[project]
name = "repofixer"
version = "0.1.0"
description = "RepoFixer: an evaluable, observable, resumable code-repository repair agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
repofixer = "repofixer.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repofixer"]
